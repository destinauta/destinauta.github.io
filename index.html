<html lang="es">
<head>
<meta charset="utf-8">

<meta name="theme-color" content="#6d1a2a">

<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">

<meta name="mobile-web-app-capable" content="yes">

<style>
/* VOICE: a friendly travel desk — confident, practical, warm.
   IDEA: a passport and a year planner in one: pick a month on the calendar strip, the stamps tell you who welcomes you.
   PICTURE: the twelve-month season strip as the hero, coloured by season, with destination cards like passport pages below.
   COLOUR and TYPE: passport burgundy dominant, sea teal support, sun yellow accent; Archivo 800 titles + Archivo body.
   LAYOUT: burgundy header band with strip, filter panel, alerts, then a responsive grid of cards. */
:root{color-scheme:light dark;
--bg:light-dark(#ffffff,#121518);--ink:light-dark(#1d1b1c,#eceae6);--mute:light-dark(#5f5a5c,#a9a4a2);
--line:light-dark(#e6e1df,#2b2f33);--card:light-dark(#ffffff,#1a1e22);--soft:light-dark(#f7f3f1,#1d2226);
--brand:#6d1a2a;--brand2:light-dark(#6d1a2a,#e07b8c);--teal:light-dark(#0e6b6b,#5cc2bf);--sun:#f2b705;
--win:#3d7ea6;--spr:#4f9457;--sum:#d89a12;--aut:#bf5b27;
--s1:light-dark(#fff3c4,#4a3f12);--s2:light-dark(#ffd9a8,#5a3510);--s3:light-dark(#ffc2bd,#5e1a1a)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Nunito,system-ui,sans-serif;overflow-x:clip}
.band{padding:clamp(24px,4vw,56px) max(5vw,16px)}
.wrap{max-width:1240px;margin:0 auto}
header{background:var(--brand);color:#fff8f0}
.top{display:flex;flex-wrap:wrap;gap:16px;justify-content:space-between;align-items:flex-start}
h1{font-weight:800;font-size:clamp(34px,5vw,52px);line-height:1.05;margin:0;text-wrap:balance}
.sub{margin:8px 0 0;max-width:62ch;opacity:.9}
.lang{display:flex;border:1.5px solid #fff8f0;border-radius:999px;overflow:hidden}
.lang button{background:none;border:0;color:#fff8f0;font:600 15px Fredoka,Nunito,sans-serif;padding:0 18px;min-height:44px;cursor:pointer}
.lang button[aria-pressed=true]{background:#fff8f0;color:var(--brand)}
.ed{margin-top:14px;font-size:14px;opacity:.85}
.months{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:6px;margin-top:28px}
.mo{border:0;border-radius:12px;min-height:92px;padding:10px 4px;cursor:pointer;color:#fff;font:600 15px Fredoka,Nunito,sans-serif;display:flex;flex-direction:column;justify-content:space-between;align-items:center;transition:transform .15s}
.mo small{font-weight:400;font-size:13px;opacity:.85}
.mo[aria-pressed=true]{outline:3px solid var(--sun);outline-offset:2px;transform:translateY(-4px)}
.mo:focus-visible,button:focus-visible,select:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.seasonline{margin-top:16px;font-size:15px}
.seasonline b{font-size:20px}
.filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:18px 26px}
.f h3{font-size:15px;margin:0 0 8px;color:var(--brand2)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:0 14px;min-height:40px;font:500 15px Fredoka,Nunito,sans-serif;cursor:pointer}
.chip[aria-pressed=true]{background:var(--teal);border-color:var(--teal);color:light-dark(#fff,#0b1a1a)}
select,input[type=search]{width:100%;min-height:44px;font:16px Fredoka,Nunito,sans-serif;border:1.5px solid var(--line);border-radius:10px;padding:0 12px;background:var(--card);color:var(--ink)}
input[type=range]{width:100%;accent-color:var(--teal);min-height:32px}
.row{display:flex;justify-content:space-between;gap:8px;font-size:14px;color:var(--mute)}
.reset{background:none;border:1.5px solid var(--brand2);color:var(--brand2);border-radius:999px;min-height:44px;padding:0 18px;font:600 15px Fredoka,Nunito,sans-serif;cursor:pointer}
.panel{background:var(--soft)}
.alerts{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));margin-top:12px}
.alert{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:15px}
.alert time{display:block;font-size:13px;color:var(--mute)}
h2{font-size:28px;line-height:1.1;margin:0}
.bar{display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:end;margin-bottom:18px}
.bar select{width:auto}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,340px),1fr));gap:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:10px}
.card h4{margin:0;font-size:20px;line-height:1.2}
.ideal{align-self:flex-start;background:var(--sun);color:#2a1d00;font-size:13px;font-weight:600;border-radius:999px;padding:2px 10px}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;text-align:center}
.stats div{background:var(--soft);border-radius:10px;padding:6px 2px}
.stats b{display:block;font-size:19px;white-space:nowrap}
.stats span{font-size:13px;color:var(--mute)}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.pill{font-size:13px;border-radius:999px;padding:3px 10px;background:var(--soft);white-space:nowrap}
.p1{background:var(--s1)}.p2{background:var(--s2)}.p3{background:var(--s3)}
.doc{font-size:15px;border-left:4px solid var(--teal);padding-left:10px}
.doc b{color:var(--teal)}
.sec{font-size:15px;border-radius:12px;padding:10px 12px;border:2px solid transparent}
.sec b{display:block;font-family:Fredoka,sans-serif;font-weight:600}
.s1{background:light-dark(#e6f5ea,#173226)}.s2{background:var(--s1)}.s3{background:var(--s2);border-color:#d9822b}.s4{background:var(--s3);border-color:#c4452b}
.warnflag{position:absolute;left:0;right:0;bottom:0;background:#c4452be8;color:#fff;font:600 14px Fredoka,sans-serif;padding:5px 12px}
.warnflag.w3{background:#d9822be8}
.see{margin:0;padding-left:18px;font-size:15px}
details summary{cursor:pointer;font-weight:600;color:var(--brand2);min-height:44px;display:flex;align-items:center}
.cal{display:grid;grid-template-columns:3.4em repeat(12,minmax(0,1fr));gap:2px;font-size:13px;align-items:end;margin:6px 0}
.cal .l{color:var(--mute);align-self:center}
.cal .m{text-align:center;color:var(--mute)}
.cal .m.on{color:var(--ink);font-weight:800}
.tb{height:60px;display:flex;align-items:flex-end;justify-content:center}
.tb i{display:block;width:72%;border-radius:4px 4px 0 0}
.cell{height:16px;border-radius:3px;background:var(--soft)}
.meta{font-size:14px;color:var(--mute);margin:6px 0}
.meta a{color:var(--teal)}
.trip{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:14px 22px;margin-bottom:22px;padding-bottom:22px;border-bottom:1.5px solid var(--line)}
.trip input[type=number]{width:100%;min-height:44px;font:16px Fredoka,Nunito,sans-serif;border:1.5px solid var(--line);border-radius:10px;padding:0 12px;background:var(--card);color:var(--ink)}
.cost{background:color-mix(in srgb,var(--sun) 18%,var(--card));border-radius:12px;padding:10px 12px;font-size:15px}
.cost b{font-size:22px;white-space:nowrap}
.cost small{display:block;color:var(--mute);font-size:13px}
.empty{padding:40px;text-align:center;color:var(--mute);border:1.5px dashed var(--line);border-radius:16px}
footer{font-size:14px;color:var(--mute)}
footer a{color:var(--teal)}
header.hero{position:relative;overflow:hidden;color:#0f2d4a;background:#8fd3f4;padding-bottom:clamp(170px,24vw,300px)}
.scene{position:absolute;inset:0;width:100%;height:100%}
.hero .wrap{position:relative}
h1{font-family:Pacifico,Fredoka,cursive;font-weight:400;font-size:clamp(40px,6vw,64px);line-height:1.15;color:#0f2d4a}
h1 small{display:block;font-family:Fredoka,sans-serif;font-weight:600;font-size:clamp(20px,2.6vw,28px);line-height:1.2;margin-top:4px}
.hero .sub{font-size:17px;font-weight:600;opacity:1}
.hero .ed{display:inline-block;background:#ffffffd0;border-radius:999px;padding:4px 14px;font-weight:600;opacity:1}
.lang{border-color:#0f2d4a;background:#ffffffb0}.lang button{color:#0f2d4a}.lang button[aria-pressed=true]{background:#0f2d4a;color:#fff}
.ticket{background:var(--bg);padding-top:28px;padding-bottom:20px;position:relative}
.ticket::before{content:"";position:absolute;left:0;right:0;top:-10px;height:20px;background:radial-gradient(circle at 10px 10px,var(--bg) 9px,transparent 10px) repeat-x;background-size:20px 20px}
.months{margin-top:0}
.mo{font-family:Fredoka,sans-serif;font-size:17px;border-radius:16px;box-shadow:0 4px 0 #0002;gap:4px}
.mo svg{width:30px;height:30px}
h2,h3,.card h4,.stats b{font-family:Fredoka,Nunito,sans-serif}
h2{font-weight:700}
.f h3{font-weight:600;font-size:16px}
.card{padding:0;overflow:hidden;border-radius:20px;box-shadow:0 6px 18px light-dark(#0f2d4a14,#0006);transition:transform .2s}
.card:hover{transform:translateY(-3px) rotate(-.3deg)}
.card>.body{padding:16px 18px 18px;display:flex;flex-direction:column;gap:10px}
.post{position:relative;height:150px;border-bottom:3px dashed light-dark(#f1e3c8,#3a3328)}
.post svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.stamp{position:absolute;right:12px;top:12px;background:#fffdf6;color:#6d1a2a;border:2px dashed #6d1a2a;padding:4px 8px;font:600 14px Fredoka,sans-serif;transform:rotate(4deg);display:flex;align-items:center;gap:4px;white-space:nowrap}
.stamp svg{position:static;width:16px;height:16px}
.ideal{position:absolute;left:12px;top:12px;width:78px;height:78px;border-radius:50%;display:grid;place-items:center;text-align:center;background:#f2b705e6;color:#2a1d00;border:2px dashed #6b4a00;font:600 13px/1.1 Fredoka,sans-serif;padding:6px;transform:rotate(-10deg)}
.card h4{font-size:22px;font-weight:600}
h2 .ic{display:inline-block;width:30px;height:30px;vertical-align:-5px;margin-right:8px}
@media(max-width:700px){.mo svg{width:22px;height:22px}}
@media(prefers-reduced-motion:reduce){.card{transition:none}.card:hover{transform:none}}
.fromrow{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;margin:0 0 12px;background:var(--soft);border-radius:14px;padding:10px 12px}
.fromrow label{font:600 16px Fredoka,sans-serif}
.fromrow input{flex:1 1 200px;min-height:44px;font:16px Nunito,sans-serif;border:1.5px solid var(--line);border-radius:10px;padding:0 12px;background:var(--card);color:var(--ink)}
.fromrow .code{font:600 15px Fredoka,sans-serif;background:var(--card);border:1.5px dashed #6d1a2a;color:#6d1a2a;border-radius:8px;padding:4px 10px}
.hdrbtns{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.hbtn{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 16px;border-radius:999px;border:1.5px solid #0f2d4a;background:#ffffffd0;color:#0f2d4a;font:600 15px Fredoka,sans-serif;cursor:pointer}
.hbtn:hover{background:#fff}
.fbarband{padding-top:20px;padding-bottom:20px}
.fbar{display:flex;flex-wrap:wrap;align-items:center;gap:12px 16px}
.fbtn{display:inline-flex;align-items:center;gap:10px;font-size:18px;padding:10px 22px}
.badge{background:#f2b705;color:#2a1d00;border-radius:999px;min-width:26px;height:26px;display:inline-grid;place-items:center;font-size:14px;padding:0 7px}
.badge[hidden]{display:none}
.fsum{color:var(--mute);font-weight:600}
.reset[hidden]{display:none}
.fsheet{width:min(720px,100%)}
.grp{font:600 15px Fredoka,sans-serif;text-transform:none;color:var(--mute);margin:18px 0 8px}
.fbody{padding:22px clamp(16px,3vw,28px) 24px}
.fbody h2{margin-right:54px}
.fsheet .trip,.fsheet .filters{display:grid;grid-template-columns:minmax(0,1fr);gap:8px;margin:0;padding:0;border:0}
.fsheet .trip{margin-bottom:8px}
details.cat{background:var(--soft);border-radius:14px;border:1.5px solid var(--line)}
details.cat[open]{border-color:var(--teal);background:var(--card)}
details.cat>summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:12px 16px;min-height:52px}
details.cat>summary::-webkit-details-marker{display:none}
details.cat>summary::after{content:"+";font:700 22px Fredoka,sans-serif;color:var(--brand2)}
details.cat[open]>summary::after{content:"–"}
.ct{font:600 17px Fredoka,sans-serif;color:var(--brand2)}
.cv{font-size:14px;color:var(--mute);text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media(max-width:600px){.ct{font-size:16px}}
details.cat>.f{padding:0 16px 16px}
details.cat>.f>h3:first-child{display:none}
details.cat>.f>h3{margin-top:12px}
.fdone{position:sticky;bottom:0;display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center;margin:16px calc(-1*clamp(16px,3vw,28px)) -24px;padding:14px clamp(16px,3vw,28px);background:var(--card);border-top:1px solid var(--line)}
.fdone .open{font-size:17px;padding:10px 22px}
#sov .sugform{margin-top:8px}
.sugwrap{max-width:760px}
.sugform{display:grid;gap:12px;margin-top:12px;background:var(--soft);border-radius:18px;padding:18px}
.sugform label{font-weight:700;font-family:Fredoka,sans-serif;display:block;margin-bottom:4px}
.sugform input,.sugform select,.sugform textarea{width:100%;font:16px Nunito,sans-serif;border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--card);color:var(--ink)}
.sugform textarea{min-height:130px;resize:vertical}
.sugstat{font-weight:700;min-height:1.5em}.sugstat.ok{color:#2f8f57}.sugstat.bad{color:#c4452b}
.inbox{margin-top:24px;border:2px dashed var(--brand2);border-radius:18px;padding:16px}
.inbox h3{font-family:Fredoka,sans-serif;margin:0 0 10px;color:var(--brand2)}
.msg{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-top:8px}
.msg small{display:block;color:var(--mute)}
.msg p{margin:4px 0 0;white-space:pre-wrap;overflow-wrap:anywhere}
.sender{margin-top:14px}.shead,.mhead{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px;align-items:center}
.delbtn{border:1.5px solid #c4452b;color:#c4452b;background:none;border-radius:999px;min-height:40px;padding:0 14px;font:600 14px Fredoka,sans-serif;cursor:pointer}
.post[data-open],.card h4{cursor:pointer}
.open{margin-top:4px;min-height:48px;border:0;border-radius:14px;background:#6d1a2a;color:#fff;font:600 16px Fredoka,sans-serif;cursor:pointer;padding:8px 14px}
.open:hover{background:#86223a}
.ov{position:fixed;inset:0;z-index:50;background:#0f2d4a99;display:flex;justify-content:center;align-items:flex-start;overflow:hidden;padding:max(2vh,8px) 8px}
.ov[hidden]{display:none}
.sheet{position:relative;width:min(860px,100%);max-height:96vh;overflow-y:auto;border-radius:22px;background:var(--card);box-shadow:0 20px 60px #0006}
.sheet .card{border:0;box-shadow:none;border-radius:0}.sheet .card:hover{transform:none}
.sheet .post{height:clamp(170px,28vw,260px)}
.sheet .card h4{font-size:clamp(26px,4vw,34px);cursor:default}
.x{position:sticky;top:10px;float:right;margin:10px 10px -54px 0;z-index:3;width:44px;height:44px;border-radius:50%;border:0;background:#fffdf6;color:#6d1a2a;font:700 20px Fredoka,sans-serif;cursor:pointer;box-shadow:0 2px 8px #0003}
.sh{font-family:Fredoka,sans-serif;font-size:22px;margin:18px 0 8px;color:var(--brand2)}
.gh{font-family:Fredoka,sans-serif;font-weight:600;font-size:17px;margin:14px 0 6px}
.full .stamp{right:64px}
.bkgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:8px}
.bkbtn{display:flex;align-items:center;min-height:48px;padding:8px 14px;border-radius:12px;background:var(--soft);color:var(--ink);text-decoration:none;font-weight:700;border:1.5px solid var(--line)}
.bkbtn:hover{border-color:var(--teal)}.bkbtn.hl{border-color:#d9822b;background:var(--s2)}
.offl{margin:0;padding-left:18px}.offl a{color:var(--teal);font-weight:700}
.tlist{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.tlist li{display:flex;gap:10px;align-items:flex-start;background:var(--soft);border-radius:10px;padding:8px 10px;font-size:15px}
.mode{flex:none;min-width:84px;text-align:center;border-radius:999px;padding:2px 8px;font:600 13px Fredoka,sans-serif;color:#fff;background:#5b6b7f}
.m-metro,.m-tram{background:#2a6fb8}.m-train{background:#6d1a2a}.m-bus{background:#2f8f57}.m-ride,.m-tuktuk{background:#c98a00}.m-ferry{background:#1f8fb0}.m-flight{background:#5a4fcf}.m-car,.m-shuttle{background:#bf5b27}.m-tour{background:#8a5a2b}.m-walk{background:#5b6b7f}
.tlinks{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}.tlinks.big{margin-top:0}
.tlink{display:inline-flex;align-items:center;min-height:32px;padding:2px 10px;border-radius:999px;border:1.5px solid var(--teal);color:var(--teal);font:600 13px Nunito,sans-serif;text-decoration:none;background:var(--card)}
.tlink:hover{background:var(--teal);color:#fff}.tlink.srch{border-style:dashed}
.carbox{border-radius:12px;padding:10px 12px;font-size:15px;background:var(--soft);border-left:5px solid #2f8f57}
.carbox.car-rec{border-left-color:#c98a00}.carbox.car-need{border-left-color:#c4452b;background:var(--s3)}.carbox.car-drv{border-left-color:#5a4fcf}
.pill.car-need{background:var(--s3);font-weight:700}.pill.car-rec{background:var(--s1)}.pill.car-drv{background:light-dark(#e4e1fb,#2a2650)}
@media(max-width:600px){.ov{padding:0}.sheet{max-height:100vh;height:100vh;border-radius:0}.mode{min-width:70px}}
@media(max-width:700px){.months{grid-template-columns:repeat(6,minmax(0,1fr))}.mo{min-height:64px}}
@media(prefers-reduced-motion:reduce){.mo{transition:none}}
.eat{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:10px 0 4px}.eat b{font-family:Fredoka,sans-serif;font-weight:600;color:var(--brand2);margin-right:4px}.eat b::before{content:"🍲 "}.eat span{background:color-mix(in srgb,var(--brand2) 12%,transparent);border-radius:999px;padding:3px 10px;font-size:.85em}
</style>
</head>
<body>
